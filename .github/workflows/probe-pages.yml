name: Probe pages

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-pages.mjs
      - name: Commit result
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data/page-probe.json
          git diff --staged --quiet || git commit -m "Probe pages $(date -u +%F)"
          git pull --rebase origin main
          git push
