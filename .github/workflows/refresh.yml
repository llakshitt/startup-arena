name: Refresh jobs

on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours (UTC 00, 05, 10, 15, 20)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          node scripts/test.mjs
          node scripts/test-ui.mjs
      - name: Fetch live roles
        run: node scripts/fetch-jobs.mjs
      - name: Commit changes
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data/jobs.json data/report.json
          git diff --staged --quiet || git commit -m "Refresh jobs $(date -u +%F)"
          git push
